name: Create AoC repository v2

on:
  workflow_dispatch:
    inputs:
      aoc_year:
        description: 'Advent of Code year (e.g. 2025)'
        required: true
        type: string

jobs:
  verify:
    runs-on: ubuntu-26.04
    outputs:
      year: ${{ steps.set-vars.outputs.year }}
      repo_name_solutions: ${{ steps.set-vars.outputs.repo_name_solutions }}
      repo_name_data: ${{ steps.set-vars.outputs.repo_name_data }}
    steps:
      - name: Validate Year Format
        id: set-vars
        env:
          YEAR: ${{ inputs.aoc_year }}
        run: |
          set -euo pipefail
          CURRENT_YEAR=$(date +%Y)
          MAX_YEAR=$((CURRENT_YEAR + 1))
          
          if [[ ! "$YEAR" =~ ^[0-9]{4}$ ]]; then
            echo "::error title=Invalid Year::Please provide a valid 4-digit year (e.g., $CURRENT_YEAR)."
            exit 1
          fi
          
          # 10# forces base 10 so values like 0999 are not parsed as octal
          YEAR_NUM=$((10#$YEAR))

          if (( YEAR_NUM < 2015 || YEAR_NUM > MAX_YEAR )); then
            echo "::error title=Invalid Year::Year must be between 2015 and $MAX_YEAR."
            exit 1
          fi
          
          echo "Year '$YEAR' format is valid."
          echo "year=$YEAR" >> $GITHUB_OUTPUT
          echo "repo_name_solutions=advent-of-code-$YEAR" >> $GITHUB_OUTPUT
          echo "repo_name_data=advent-of-code-$YEAR-data" >> $GITHUB_OUTPUT

      - name: Check Required Secrets
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          CODACY_API_TOKEN: ${{ secrets.CODACY_API_TOKEN }}
          AOC_APP_CLIENT_ID: ${{ secrets.AOC_APP_CLIENT_ID }}
          AOC_APP_PRIVATE_KEY: ${{ secrets.AOC_APP_PRIVATE_KEY }}
        run: |
          set -uo pipefail
          MISSING=0
          for name in PAT_TOKEN CODACY_API_TOKEN AOC_APP_CLIENT_ID AOC_APP_PRIVATE_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing Secret::$name secret is not set."
              MISSING=1
            fi
          done
          exit "$MISSING"

  # Bootstraps the solutions repository, initializing any needed tokens and basic configurations.
  bootstrap-solutions-repo:
    needs: verify
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Create Solutions Repository
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          REPO_NAME: ${{ needs.verify.outputs.repo_name_solutions }}
          OWNER:  ${{ github.repository_owner }}
        run: |
          echo "Creating repository $OWNER/$REPO_NAME from template..."
          gh repo create "$REPO_NAME" --template "Flashky/advent-of-code-yyyy" --public

      - name: Make scripts executable
        run: chmod +x .github/scripts/codacy-add-repository.sh .github/scripts/codacy-create-token.sh

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.AOC_APP_CLIENT_ID }}
          private-key: ${{ secrets.AOC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Register Repository in Codacy
        env:
          CODACY_API_TOKEN: ${{ secrets.CODACY_API_TOKEN }}
          REPO_NAME: ${{ needs.verify.outputs.repo_name_solutions }}
        run: bash .github/scripts/codacy-add-repository.sh "$REPO_NAME"

      - name: Generate Codacy Project Token
        id: codacy-token
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CODACY_API_TOKEN: ${{ secrets.CODACY_API_TOKEN }}
          REPO_NAME: ${{ needs.verify.outputs.repo_name_solutions }}
        run: |
          set -euo pipefail
          PROJECT_TOKEN=$(bash .github/scripts/codacy-create-token.sh "$REPO_NAME")
          echo "::add-mask::$PROJECT_TOKEN"
          echo "token=$PROJECT_TOKEN" >> $GITHUB_OUTPUT

      - name: Configure Secrets and Variables
        env:
          # GH_TOKEN for GitHub CLI commands. The others for injecting at the created repo.
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          AOC_APP_CLIENT_ID: ${{ secrets.AOC_APP_CLIENT_ID }}
          AOC_APP_PRIVATE_KEY: ${{ secrets.AOC_APP_PRIVATE_KEY }}
          CODACY_PROJECT_TOKEN: ${{ steps.codacy-token.outputs.token }}
          YEAR: ${{ needs.verify.outputs.year }}
          REPO_NAME: ${{ needs.verify.outputs.repo_name_solutions }}
          OWNER:  ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          echo "Setting AOC_APP_CLIENT_ID secret for Actions..."
          gh secret set AOC_APP_CLIENT_ID --body "$AOC_APP_CLIENT_ID" --repo "$OWNER/$REPO_NAME"
          
          echo "Setting AOC_APP_PRIVATE_KEY secret for Actions..."
          gh secret set AOC_APP_PRIVATE_KEY --body "$AOC_APP_PRIVATE_KEY" --repo "$OWNER/$REPO_NAME"
          
          echo "Setting CODACY_PROJECT_TOKEN secret for Actions..."
          gh secret set CODACY_PROJECT_TOKEN --body "$CODACY_PROJECT_TOKEN" --repo "$OWNER/$REPO_NAME"
          
          echo "Setting PAT_TOKEN secret for Dependabot..."
          gh secret set PAT_TOKEN --body "$PAT_TOKEN" --app dependabot --repo "$OWNER/$REPO_NAME"
          
          echo "Setting AOC_YEAR variable for workflows..."
          gh variable set AOC_YEAR --body "$YEAR" --repo "$OWNER/$REPO_NAME"

      - name: Enable Auto-Merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO_NAME: ${{ needs.verify.outputs.repo_name_solutions }}
          OWNER:  ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          echo "Enabling auto-merge for $REPO_NAME..."
          gh api "repos/$OWNER/$REPO_NAME" -X PATCH  -F allow_auto_merge=true

      - name: Allow Actions to Create and Approve PRs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO_NAME: ${{ needs.verify.outputs.repo_name_solutions }}
          OWNER:  ${{ github.repository_owner }}
        run: |
          echo "Configuring workflow permissions for $REPO_NAME..."
          gh api --method PUT "repos/Flashky/$REPO_NAME/actions/permissions/workflow" \
            -F default_workflow_permissions="write" \
            -F can_approve_pull_request_reviews=true

      - name: Import Branch Protection Ruleset
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO_NAME: ${{ needs.verify.outputs.repo_name_solutions }}
          OWNER:  ${{ github.repository_owner }}
          RULESET_FILE: ".github/settings/branch-protection-ruleset.json"
        run: |
          
          if [ ! -f "$RULESET_FILE" ]; then
            echo "::error title=Ruleset Missing::Ruleset file not found at $RULESET_FILE, skipping."
            exit 1    
          fi
          
          echo "Importing branch protection ruleset into $REPO_NAME..."
          gh api "repos/$OWNER/$REPO_NAME/rulesets" --method POST --input "$RULESET_FILE"
          echo "Ruleset successfully applied!"

      - name: Trigger Setup Workflow
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          YEAR: ${{ needs.verify.outputs.year }}
          REPO_NAME: ${{ needs.verify.outputs.repo_name_solutions }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          
          echo "Triggering 'Setup' workflow in $OWNER/$REPO_NAME for year $YEAR..."
          gh workflow run "Setup" \
            --repo "$OWNER/$REPO_NAME" \
            -f aoc_year="$YEAR"
          
          echo "Setup workflow successfully triggered!"

