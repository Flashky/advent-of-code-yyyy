name: Setup
on:
  workflow_dispatch:
    inputs:
      aoc_year:
        description: 'Advent of Code year (e.g. 2025)'
        required: true
        type: string
env:
  AOC_YEAR: ${{ github.event.inputs.aoc_year }}

jobs:
  verify:
    runs-on: ubuntu-26.04
    outputs:
      year: ${{ steps.set-vars.outputs.year }}
      repo_name_solutions: ${{ steps.set-vars.outputs.repo_name_solutions }}
      repo_name_data: ${{ steps.set-vars.outputs.repo_name_data }}
    steps:
      - name: Validate Year Format
        id: set-vars
        env:
          YEAR: ${{ inputs.aoc_year }}
        run: |
          set -euo pipefail
          CURRENT_YEAR=$(date +%Y)
          MAX_YEAR=$((CURRENT_YEAR + 1))

          if [[ ! "$YEAR" =~ ^[0-9]{4}$ ]]; then
            echo "::error title=Invalid Year::Please provide a valid 4-digit year (e.g., $CURRENT_YEAR)."
            exit 1
          fi

          # 10# forces base 10 so values like 0999 are not parsed as octal
          YEAR_NUM=$((10#$YEAR))

          if (( YEAR_NUM < 2015 || YEAR_NUM > MAX_YEAR )); then
            echo "::error title=Invalid Year::Year must be between 2015 and $MAX_YEAR."
            exit 1
          fi

          echo "Year '$YEAR' format is valid."
          echo "year=$YEAR" >> $GITHUB_OUTPUT
          echo "repo_name_solutions=advent-of-code-$YEAR" >> $GITHUB_OUTPUT
          echo "repo_name_data=advent-of-code-$YEAR-data" >> $GITHUB_OUTPUT

      - name: Check Required Secrets
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
          AOC_APP_CLIENT_ID: ${{ secrets.AOC_APP_CLIENT_ID }}
          AOC_APP_PRIVATE_KEY: ${{ secrets.AOC_APP_PRIVATE_KEY }}
        run: |
          set -uo pipefail
          MISSING=0
          for name in CODACY_PROJECT_TOKEN AOC_APP_CLIENT_ID AOC_APP_PRIVATE_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing Secret::$name secret is not set."
              MISSING=1
            fi
          done
          exit "$MISSING"

  update:
    needs: verify
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.AOC_APP_CLIENT_ID }}
          private-key: ${{ secrets.AOC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ needs.verify.outputs.repo_name_solutions }}

        # Update repository description
      - name: Update Repository Description
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh repo edit -d "Advent of Code ${{ env.AOC_YEAR }}"

        # Update repository topics
      - name: Update Repository Topics
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh repo edit \
            --add-topic "java" \
            --add-topic "advent-of-code" \
            --add-topic "advent-of-code-${{ env.AOC_YEAR }}" \
            --add-topic "advent-of-code-${{ env.AOC_YEAR }}-java" \
            --add-topic "advent-of-code-flashky"

      # Clean up folders and README if AoC event is 2025 or newer.
      - name: Clean Up (2025+)
        if: ${{ env.AOC_YEAR >= 2025 }}
        run: |
          echo "Year ${{ env.AOC_YEAR }} is 2025 or greater. Performing cleanup..."
          
          echo "Removing day13-day25 source and test folders."
          rm -rf src/{main,test}/java/com/adventofcode/flashk/day{13..25}
          
          echo "Removing day 13 to 25 links from README.md."
          sed -i '/^- \[Day \(1[3-9]\|2[0-5]\)/d' README.md

      # Update README.md
      - name: Update README.md
        run: |
          find . -name 'README.md' | xargs sed -i 's/{year}/'${{ env.AOC_YEAR }}'/g'

      # Update pom.xml
      - name: Update pom.xml
        run: |
          find . -name 'pom.xml' | xargs sed -i 's/yyyy/'${{ env.AOC_YEAR }}'/g'

      # Open Pull Request
      - name: Open Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        id: pull-request
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: "Update year to ${{ env.AOC_YEAR}}"
          sign-commits: true
          branch: feature/setup
          title: "Update year to ${{ env.AOC_YEAR}}"
          body: |
            This PR is auto-generated by [create-pull-request](https://github.com/peter-evans/create-pull-request).

      # Check PR information
      - name: Check PR information
        if: ${{ steps.pull-request.outputs.pull-request-number }}
        run: |
          echo "Pull Request Number - ${{ steps.pull-request.outputs.pull-request-number }}"
          echo "Pull Request URL - ${{ steps.pull-request.outputs.pull-request-url }}"

      - name: Enable Pull Request Auto-Merge
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL:  ${{ steps.pull-request.outputs.pull-request-url }}
        run: |
          if gh pr merge --auto --squash "$PR_URL" --delete-branch; then
            echo "Auto-merge has been enabled. Pull Request will be merged after all checks are met."
          else
            echo "All checks are currently met. Merging directly"
            gh pr merge "$PR_URL" --squash --delete-branch
          fi
