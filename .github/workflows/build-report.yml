# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Build & Report

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  schedule:
    - cron: '0 3 * * *' # Every day at 03:00 UTC

jobs:

  verify:
    # Don't run just after creating repo from template
    #if: github.run_number != 1
    runs-on: ubuntu-26.04
    outputs:
      skip_report_status: ${{ steps.check-codacy-token.outputs.skip_status }}
    steps:

      - name: Check Required Secrets
        env:
          CODACY_API_TOKEN: ${{ secrets.CODACY_API_TOKEN }}
          AOC_APP_CLIENT_ID: ${{ secrets.AOC_APP_CLIENT_ID }}
          AOC_APP_PRIVATE_KEY: ${{ secrets.AOC_APP_PRIVATE_KEY }}
        run: |
          set -uo pipefail
          MISSING=0
          for name in AOC_APP_CLIENT_ID AOC_APP_PRIVATE_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing Secret::$name secret is not set."
              MISSING=1
            fi
          done
          exit "$MISSING"

      # Codacy token is optional, in case of not wanting Codacy reports
      - name: Check Codacy Project Token
        id: check-codacy-token
        continue-on-error: true
        run: |
          if [ -z "${{ secrets.CODACY_PROJECT_TOKEN }}" ]; then
            echo "::warning title=Missing CODACY_PROJECT_TOKEN::Codacy coverage report job will be skipped."
            echo "skip_status=true" >> $GITHUB_OUTPUT
            exit 1 
          fi
          echo "skip_status=false" >> $GITHUB_OUTPUT

  build:
    runs-on: ubuntu-26.04
    needs: verify
    steps:

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.AOC_APP_CLIENT_ID }}
          private-key: ${{ secrets.AOC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            ${{ github.event.repository.name }}
            ${{ github.event.repository.name }}-data

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          submodules: recursive
          
      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 27
      - name: Build with Maven
        run: mvn -B package --file pom.xml
      - name: Upload Jacoco report artifact
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco/jacoco.xml

  # Report job
  # Will be only executed if CODACY_PROJECT_TOKEN is set
  report:
    runs-on: ubuntu-26.04
    needs: build
    if: ${{ needs.verify.outputs.skip_report_status == 'false' }}
    steps:
      - uses: actions/checkout@v7
      - name: Download Jacoco report artifact
        uses: actions/download-artifact@v8
        with:
          name: jacoco-report
          path: target/site/jacoco
      - name: Send coverage to Codacy
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1.3.0
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
