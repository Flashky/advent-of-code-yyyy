name: Create AoC repository

on:
  workflow_dispatch:
    inputs:
      aoc_year:
        description: 'Advent of Code year (e.g. 2025)'
        required: true
        type: string

jobs:
  create-repo:
    runs-on: ubuntu-26.04
    steps:
      - name: Validate Year Format
        env:
          YEAR: ${{ inputs.aoc_year }}
        run: |
          if [[ "$YEAR" =~ ^[0-9]{4}$ ]]; then
            echo "Year '$YEAR' format is valid."
          else
            echo "::error title=Invalid Year::Please provide a valid 4-digit year (e.g., 2025)."
            exit 1
          fi

      - name: Authenticate with GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          gh auth setup-git

      - name: Create Repository from Template
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          YEAR: ${{ inputs.aoc_year }}
        run: |
          REPO_NAME="advent-of-code-$YEAR"
          
          # 1. Crear el repositorio nuevo a partir del template actual
          echo "Creating repository Flashky/$REPO_NAME from template..."
          gh repo create "Flashky/$REPO_NAME" \
            --template "Flashky/advent-of-code-yyyy" --public
          
          # 2. Activar el auto-merge inmediatamente
          echo "Enabling auto-merge..."
          gh api "repos/Flashky/$REPO_NAME" \
            -X PATCH \
            -F allow_auto_merge=true
          
          # 3. Configurar el secreto PAT_TOKEN en el nuevo repositorio
          echo "Setting PAT_TOKEN secret Actions..."
          gh secret set PAT_TOKEN --body "${{ secrets.PAT_TOKEN }}" --repo "Flashky/$REPO_NAME"

          echo "Setting PAT_TOKEN secret for Dependabot..."
          gh secret set PAT_TOKEN --body "${{ secrets.PAT_TOKEN }}" --app dependabot --repo "Flashky/$REPO_NAME"

          # 4. Integración con Codacy: Habilitar repo y generar Project Token
          echo "Syncing repository with Codacy and generating project token..."
          
          CODACY_PROVIDER="gh"
          CODACY_OWNER="Flashky"

          # Paso A: Forzar la sincronización / habilitar el repositorio en Codacy
          # (Dependiendo de la configuración de tu organización en Codacy, los repos públicos a veces se auto-detectan,
          # pero este endpoint asegura el registro/activación mediante su API v3)
          curl -s -X POST "https://api.codacy.com/api/v3/organizations/$CODACY_PROVIDER/$CODACY_OWNER/repositories/$REPO_NAME/enable" \
            -H "Accept: application/json" \
            -H "api-token: ${{ secrets.CODACY_API_TOKEN }}" \
            || echo "Repository might already be enabled or pending synchronization."

          # Paso B: Intentar crear/obtener el token de proyecto específico para este repo
          # (El endpoint de creación de tokens de proyecto en la API v3 de Codacy)
          TOKEN_RESPONSE=$(curl -s -X POST "https://api.codacy.com/api/v3/organizations/$CODACY_PROVIDER/$CODACY_OWNER/repositories/$REPO_NAME/tokens" \
              -H "Accept: application/json" \
              -H "Content-Type: application/json" \
              -H "api-token: ${{ secrets.CODACY_API_TOKEN }}" \
              -d '{"name": "gh-actions-auto-token"}')
          
          PROJECT_TOKEN=$(echo "$TOKEN_RESPONSE" | jq -r '.data.token // .token // empty')

          if [ -n "$PROJECT_TOKEN" ] && [ "$PROJECT_TOKEN" != "null" ]; then
            echo "Codacy project token successfully generated!"
            break
          else 
            echo "::error title=Codacy Token Error::Timed out waiting for Codacy repository indexing and token generation."
            exit 1
          fi

          # Paso C: Inyectar el token obtenido en el nuevo repositorio de GitHub (Actions y Dependabot)
          echo "Setting CODACY_PROJECT_TOKEN secret for Actions..."
          gh secret set CODACY_PROJECT_TOKEN --body "$PROJECT_TOKEN" --repo "Flashky/$REPO_NAME"
          
          echo "Setting CODACY_PROJECT_TOKEN secret for Dependabot..."
          gh secret set CODACY_PROJECT_TOKEN --body "$PROJECT_TOKEN" --app dependabot --repo "Flashky/$REPO_NAME"
            
          # 3. Esperar unos segundos a que GitHub inicialice las acciones del nuevo repo
          #echo "Waiting for repository initialization..."
          #sleep 10

          # 5. Disparar el workflow 'Update year' en el nuevo repositorio
          echo "Triggering 'Update year' workflow..."
          gh workflow run "Update year" \
            --repo "Flashky/$REPO_NAME" \
            -f aoc_year="$YEAR"
          
          echo "Repository Flashky/$REPO_NAME successfully created and configured!"
