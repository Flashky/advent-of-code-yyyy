name: Create AoC repository

on:
  workflow_dispatch:
    inputs:
      aoc_year:
        description: 'Advent of Code year (e.g. 2025)'
        required: true
        type: string

jobs:
  verify:
    runs-on: ubuntu-26.04
    outputs:
      repo_name: ${{ steps.set-vars.outputs.repo_name }}
      year: ${{ steps.set-vars.outputs.year }}
    steps:
      - name: Validate Year Format
        id: set-vars
        env:
          YEAR: ${{ inputs.aoc_year }}
        run: |
          if [[ "$YEAR" =~ ^[0-9]{4}$ ]]; then
            echo "Year '$YEAR' format is valid."
            echo "year=$YEAR" >> $GITHUB_OUTPUT
            echo "repo_name=advent-of-code-$YEAR" >> $GITHUB_OUTPUT
          else
            echo "::error title=Invalid Year::Please provide a valid 4-digit year (e.g., 2025)."
            exit 1
          fi

      - name: Check Required Secrets
        run: |
          MISSING=0
          if [ -z "${{ secrets.PAT_TOKEN }}" ]; then
            echo "::error title=Missing Secret::PAT_TOKEN secret is not set."
            MISSING=1
          fi
          if [ -z "${{ secrets.CODACY_API_TOKEN }}" ]; then
            echo "::error title=Missing Secret::CODACY_API_TOKEN secret is not set."
            MISSING=1
          fi
          if [ "$MISSING" -eq 1 ]; then
            exit 1
          fi

  create-repository:
    needs: verify
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Authenticate with GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          gh auth setup-git

      - name: Create Repository from Template
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          REPO_NAME="${{ needs.verify.outputs.repo_name }}"
          echo "Creating repository Flashky/$REPO_NAME from template..."
          gh repo create "Flashky/$REPO_NAME" --template "Flashky/advent-of-code-yyyy" --public

  create-data-repository:
    needs: verify
    runs-on: ubuntu-26.04
    steps:
      - name: Authenticate with GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          gh auth setup-git

      - name: Create Data Repository from Template
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          DATA_REPO_NAME="${{ needs.verify.outputs.repo_name }}-data"
          echo "Creating private data repository Flashky/$DATA_REPO_NAME from template..."
          gh repo create "Flashky/$DATA_REPO_NAME" --template "Flashky/advent-of-code-yyyy-data" --private

  configure-settings:
    needs: [verify, create-repository]
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Authenticate with GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          gh auth setup-git

      - name: Enable Auto-Merge
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          REPO_NAME="${{ needs.verify.outputs.repo_name }}"
          echo "Enabling auto-merge for $REPO_NAME..."
          gh api "repos/Flashky/$REPO_NAME" \
            -X PATCH \
            -F allow_auto_merge=true

      - name: Allow Actions to Create and Approve PRs
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          REPO_NAME="${{ needs.verify.outputs.repo_name }}"
          echo "Configuring workflow permissions for $REPO_NAME..."
          gh api --method PUT "repos/Flashky/$REPO_NAME/actions/permissions/workflow" \
            -F default_workflow_permissions="write" \
            -F can_approve_pull_request_reviews=true

      - name: Import Branch Protection Ruleset
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          REPO_NAME="${{ needs.verify.outputs.repo_name }}"
          RULESET_FILE=".github/settings/branch-protection-ruleset.json"
          
          if [ -f "$RULESET_FILE" ]; then
            echo "Importing branch protection ruleset into $REPO_NAME..."
            gh api "repos/Flashky/$REPO_NAME/rulesets" --method POST --input "$RULESET_FILE"
            echo "Ruleset successfully applied!"
          else
            echo "::warning title=Ruleset Missing::Ruleset file not found at $RULESET_FILE, skipping."
          fi

  configure-pat-secrets:
    needs: [verify, create-repository]
    runs-on: ubuntu-26.04
    steps:
      - name: Authenticate with GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          gh auth setup-git

      - name: Set PAT_TOKEN Secret for Actions and Dependabot
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          REPO_NAME="${{ needs.verify.outputs.repo_name }}"
          
          echo "Setting PAT_TOKEN secret for Actions..."
          gh secret set PAT_TOKEN --body "$PAT_TOKEN" --repo "Flashky/$REPO_NAME"
          
          echo "Setting PAT_TOKEN secret for Dependabot..."
          gh secret set PAT_TOKEN --body "$PAT_TOKEN" --app dependabot --repo "Flashky/$REPO_NAME"

  configure-codacy:
    needs: [verify, create-repository]
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Authenticate with GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          gh auth setup-git

      - name: Make scripts executable
        run: chmod +x .github/scripts/codacy-add-repository.sh .github/scripts/codacy-create-token.sh

      - name: Register Repository in Codacy
        env:
          CODACY_API_TOKEN: ${{ secrets.CODACY_API_TOKEN }}
        run: |
          REPO_NAME="${{ needs.verify.outputs.repo_name }}"
          bash .github/scripts/codacy-add-repository.sh "$REPO_NAME"

      - name: Generate and Configure Codacy Project Token
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          CODACY_API_TOKEN: ${{ secrets.CODACY_API_TOKEN }}
        run: |
          REPO_NAME="${{ needs.verify.outputs.repo_name }}"

          if PROJECT_TOKEN=$(bash .github/scripts/codacy-create-token.sh "$REPO_NAME"); then
            echo "Token successfully generated!"
          else
            echo "::error title=Codacy Token Error::Failed to generate Codacy token."
            exit 1
          fi
          
          # Mask and set secrets in the new repository
          echo "::add-mask::$PROJECT_TOKEN"
          
          echo "Setting CODACY_PROJECT_TOKEN secret for Actions..."
          gh secret set CODACY_PROJECT_TOKEN --body "$PROJECT_TOKEN" --repo "Flashky/$REPO_NAME"
          
          echo "Setting CODACY_PROJECT_TOKEN secret for Dependabot..."
          gh secret set CODACY_PROJECT_TOKEN --body "$PROJECT_TOKEN" --app dependabot --repo "Flashky/$REPO_NAME"

  configure-data-settings:
    needs: [verify, create-data-repository]
    runs-on: ubuntu-26.04
    steps:
      - name: Authenticate with GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          gh auth setup-git

      - name: Allow Actions to Create and Approve PRs on Data Repo
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          DATA_REPO_NAME="${{ needs.verify.outputs.repo_name }}-data"
          echo "Configuring workflow permissions for $DATA_REPO_NAME..."
          gh api --method PUT "repos/Flashky/$DATA_REPO_NAME/actions/permissions/workflow" \
            -F default_workflow_permissions="write" \
            -F can_approve_pull_request_reviews=true

  configure-data-pat-secrets:
    needs: [verify, create-data-repository]
    runs-on: ubuntu-26.04
    steps:
      - name: Authenticate with GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          gh auth setup-git

      - name: Set PAT_TOKEN Secret for Actions on Data Repo
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          DATA_REPO_NAME="${{ needs.verify.outputs.repo_name }}-data"
          
          echo "Setting PAT_TOKEN secret for Actions on $DATA_REPO_NAME..."
          gh secret set PAT_TOKEN --body "$PAT_TOKEN" --repo "Flashky/$DATA_REPO_NAME"

  trigger-solutions-update-year:
    needs: [ verify, configure-settings, configure-pat-secrets, configure-codacy ]
    runs-on: ubuntu-26.04
    steps:
      - name: Authenticate with GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          gh auth setup-git

      - name: Trigger 'Update year' workflow
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          REPO_NAME: ${{ needs.verify.outputs.repo_name }}
        run: |
          YEAR="${{ needs.verify.outputs.year }}"
          
          echo "Waiting a few seconds for repository initialization..."
          sleep 5
          
          echo "Triggering 'Update year' workflow..."
          gh workflow run "Update year" \
            --repo "Flashky/$REPO_NAME" \
            -f aoc_year="$YEAR" \
            || echo "Warning: Workflow 'Update year' could not be triggered automatically (it might not exist in the template yet)."
          
          echo "Repository Flashky/$REPO_NAME successfully created and fully configured!"

  trigger-data-update-year:
    needs: [verify, create-data-repository, configure-data-settings, configure-data-pat-secrets]
    runs-on: ubuntu-26.04
    steps:
      - name: Authenticate with GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          gh auth setup-git

      - name: Trigger 'Update year' workflow on Data Repository
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          DATA_REPO_NAME: "${{ needs.verify.outputs.repo_name }}-data"
        run: |
          YEAR="${{ needs.verify.outputs.year }}"
          
          echo "Waiting a few seconds for data repository initialization..."
          sleep 10
          
          echo "Triggering 'Update year' workflow on $DATA_REPO_NAME..."
          gh workflow run "Update year" \
            --repo "Flashky/$DATA_REPO_NAME" \
            -f aoc_year="$YEAR" \
            || echo "Warning: Workflow 'Update year' could not be triggered automatically."
          
          echo "Repository Flashky/$DATA_REPO_NAME successfully created and fully configured!"

  add-data-submodule:
    needs: [verify, configure-settings, configure-pat-secrets, create-data-repository]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Authenticate with GitHub CLI and Configure Git Identity
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          gh auth setup-git
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git config --global url."https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Checkout Solutions Repository
        uses: actions/checkout@v7
        with:
          repository: "Flashky/${{ needs.verify.outputs.repo_name }}"
          token: ${{ secrets.PAT_TOKEN }}
          submodules: false

      - name: Add Data Repository as Submodule
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          DATA_REPO_NAME="${{ needs.verify.outputs.repo_name }}-data"
          
          echo "Adding private data repository as submodule..."
          git submodule add -b master "https://github.com/Flashky/$DATA_REPO_NAME.git" src/test/resources/inputs

      - name: Create Pull Request for Submodule
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "test: add data repository as submodule"
          sign-commits: true
          title: "Add data repository as submodule"
          body: |
            This PR automatically adds the private data repository as a submodule under `src/test/resources/inputs`.
          branch: add-data-submodule
          base: master

  generate-pull-request-summary:
    needs: [verify, trigger-solutions-update-year, trigger-data-update-year, add-data-submodule]
    runs-on: ubuntu-26.04
    steps:
      - name: Authenticate with GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          gh auth setup-git

      - name: Find and Annotate Update Year PRs
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          REPO_NAME="${{ needs.verify.outputs.repo_name }}"
          DATA_REPO_NAME="$REPO_NAME-data"
          
          echo "Waiting 20 seconds for workflows to generate Pull Requests..."
          sleep 20
          
          echo "Fetching solutions repository PR..."
          SOLUTIONS_PR_URL=$(gh pr list --repo "Flashky/$REPO_NAME" --state open --search "Update year" --json url --jq '.[0].url // empty')
          
          echo "Fetching data repository PR..."
          DATA_PR_URL=$(gh pr list --repo "Flashky/$DATA_REPO_NAME" --state open --search "Update year" --json url --jq '.[0].url // empty')
          
          echo "Fetching solutions Submodule PR..."
          SUBMODULE_PR=$(gh pr list --repo "Flashky/$REPO_NAME" --state open --search "Add data repository as submodule" --json url --jq '.[0].url // empty')
          
          echo "### 🎄 Advent of Code Setup Summary" >> $GITHUB_STEP_SUMMARY
          echo "Repositories have been successfully created, configured, and initialized." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -n "$SOLUTIONS_PR_URL" ]; then
            echo "::notice title=Solutions PR Ready::Please review and merge the Update year PR for solutions: $SOLUTIONS_PR_URL"
            echo "- 🚀 **Solutions Repository PR**: [Merge Update PR]($SOLUTIONS_PR_URL)" >> $GITHUB_STEP_SUMMARY
          else
            echo "::warning::Solutions PR could not be found automatically."
          fi
          
          if [ -n "$DATA_PR_URL" ]; then
            echo "::notice title=Data PR Ready::Please review and merge the Update year PR for data: $DATA_PR_URL"
            echo "- 💾 **Data Repository PR**: [Merge Update PR]($DATA_PR_URL)" >> $GITHUB_STEP_SUMMARY
          else
            echo "::warning::Data PR could not be found automatically."
          fi
          
          if [ -n "$SUBMODULE_PR" ]; then
            echo "::notice title=Submodule PR Ready::Please review and merge the Submodule PR for solutions:: $SUBMODULE_PR"
            echo "- 🔗 **Solutions - Submodule PR**: [Merge PR]($SUBMODULE_PR)" >> $GITHUB_STEP_SUMMARY
          else
            echo "::warning::Solutions Submodule PR could not be found automatically."
          fi