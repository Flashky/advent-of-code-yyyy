name: Create AoC repository

on:
  workflow_dispatch:
    inputs:
      aoc_year:
        description: 'Advent of Code year (e.g. 2026)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: create-repo-${{ inputs.aoc_year }}
  cancel-in-progress: false

env:
  OWNER: ${{ github.repository_owner }}

jobs:
  verify:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      repo_name: ${{ steps.set-vars.outputs.repo_name }}
      data_repo_name: ${{ steps.set-vars.outputs.data_repo_name }}
      year: ${{ steps.set-vars.outputs.year }}
    steps:
      - name: Validate Year
        id: set-vars
        env:
          YEAR: ${{ inputs.aoc_year }}
        run: |
          set -euo pipefail
          CURRENT_YEAR=$(date +%Y)
          MAX_YEAR=$((CURRENT_YEAR + 1))

          if [[ ! "$YEAR" =~ ^[0-9]{4}$ ]]; then
            echo "::error title=Invalid Year::Please provide a valid 4-digit year (e.g., $CURRENT_YEAR)."
            exit 1
          fi

          # 10# forces base 10 so values like 0999 are not parsed as octal
          YEAR_NUM=$((10#$YEAR))

          if (( YEAR_NUM < 2015 || YEAR_NUM > MAX_YEAR )); then
            echo "::error title=Invalid Year::Year must be between 2015 and $MAX_YEAR."
            exit 1
          fi

          echo "Year '$YEAR' format is valid."
          echo "year=$YEAR" >> "$GITHUB_OUTPUT"
          echo "repo_name=advent-of-code-$YEAR" >> "$GITHUB_OUTPUT"
          echo "data_repo_name=advent-of-code-$YEAR-data" >> "$GITHUB_OUTPUT"

      - name: Check Required Secrets
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          CODACY_API_TOKEN: ${{ secrets.CODACY_API_TOKEN }}
          AOC_APP_CLIENT_ID: ${{ secrets.AOC_APP_CLIENT_ID }}
          AOC_APP_CLIENT_SECRET: ${{ secrets.AOC_APP_CLIENT_SECRET }}
        run: |
          set -uo pipefail
          MISSING=0
          for name in PAT_TOKEN CODACY_API_TOKEN AOC_APP_CLIENT_ID AOC_APP_CLIENT_SECRET; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing Secret::$name secret is not set."
              MISSING=1
            fi
          done
          exit "$MISSING"

  create-repository:
    needs: verify
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Create Repository from Template
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          REPO_NAME: ${{ needs.verify.outputs.repo_name }}
        run: |
          set -euo pipefail
          if gh repo view "$OWNER/$REPO_NAME" >/dev/null 2>&1; then
            echo "::notice title=Repository exists::$OWNER/$REPO_NAME already exists, skipping creation."
            exit 0
          fi
          echo "Creating repository $OWNER/$REPO_NAME from template..."
          gh repo create "$OWNER/$REPO_NAME" --template "$OWNER/advent-of-code-yyyy" --public

  create-data-repository:
    needs: verify
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Create Data Repository from Template
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          DATA_REPO_NAME: ${{ needs.verify.outputs.data_repo_name }}
        run: |
          set -euo pipefail
          if gh repo view "$OWNER/$DATA_REPO_NAME" >/dev/null 2>&1; then
            echo "::notice title=Repository exists::$OWNER/$DATA_REPO_NAME already exists, skipping creation."
            exit 0
          fi
          echo "Creating private data repository $OWNER/$DATA_REPO_NAME from template..."
          gh repo create "$OWNER/$DATA_REPO_NAME" --template "$OWNER/advent-of-code-yyyy-data" --private

  configure-settings:
    needs: [verify, create-repository]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Enable Auto-Merge
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          REPO_NAME: ${{ needs.verify.outputs.repo_name }}
        run: |
          set -euo pipefail
          echo "Enabling auto-merge for $REPO_NAME..."
          gh api "repos/$OWNER/$REPO_NAME" \
            -X PATCH \
            -F allow_auto_merge=true

      - name: Allow Actions to Create and Approve PRs
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          REPO_NAME: ${{ needs.verify.outputs.repo_name }}
        run: |
          set -euo pipefail
          echo "Configuring workflow permissions for $REPO_NAME..."
          gh api --method PUT "repos/$OWNER/$REPO_NAME/actions/permissions/workflow" \
            -F default_workflow_permissions="write" \
            -F can_approve_pull_request_reviews=true

      - name: Import Branch Protection Ruleset
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          REPO_NAME: ${{ needs.verify.outputs.repo_name }}
        run: |
          set -euo pipefail
          RULESET_FILE=".github/settings/branch-protection-ruleset.json"

          if [ -f "$RULESET_FILE" ]; then
            echo "Importing branch protection ruleset into $REPO_NAME..."
            gh api "repos/$OWNER/$REPO_NAME/rulesets" --method POST --input "$RULESET_FILE"
            echo "Ruleset successfully applied!"
          else
            echo "::warning title=Ruleset Missing::Ruleset file not found at $RULESET_FILE, skipping."
          fi

  configure-secrets:
    needs: [verify, create-repository]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Set Secrets
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          AOC_APP_CLIENT_ID: ${{ secrets.AOC_APP_CLIENT_ID }}
          AOC_APP_CLIENT_SECRET: ${{ secrets.AOC_APP_CLIENT_SECRET }}
          REPO_NAME: ${{ needs.verify.outputs.repo_name }}
        run: |
          set -euo pipefail
          REPO="$OWNER/$REPO_NAME"

          echo "Setting PAT_TOKEN secret for Actions and Dependabot..."
          gh secret set PAT_TOKEN --body "$PAT_TOKEN" --repo "$REPO"
          gh secret set PAT_TOKEN --body "$PAT_TOKEN" --app dependabot --repo "$REPO"

          # The GitHub App token signs the commits of the auto-generated PRs,
          # so the new repository needs the App credentials as well.
          echo "Setting AOC_APP_CLIENT_ID secret..."
          gh secret set AOC_APP_CLIENT_ID --body "$AOC_APP_CLIENT_ID" --repo "$REPO"

          echo "Setting AOC_APP_CLIENT_SECRET secret..."
          gh secret set AOC_APP_CLIENT_SECRET --body "$AOC_APP_CLIENT_SECRET" --repo "$REPO"

  configure-codacy:
    needs: [verify, create-repository]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Make scripts executable
        run: chmod +x .github/scripts/codacy-add-repository.sh .github/scripts/codacy-create-token.sh

      # Registration is idempotent: an already registered repository makes the
      # script fail, so failures are tolerated here and validated by the token
      # generation step below.
      - name: Register Repository in Codacy
        env:
          CODACY_API_TOKEN: ${{ secrets.CODACY_API_TOKEN }}
          REPO_NAME: ${{ needs.verify.outputs.repo_name }}
        run: |
          set -uo pipefail
          for attempt in $(seq 1 6); do
            if bash .github/scripts/codacy-add-repository.sh "$REPO_NAME"; then
              echo "Repository registered."
              break
            fi
            echo "Attempt $attempt failed; retrying in 10s..."
            sleep 10
          done

      - name: Generate and Configure Codacy Project Token
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          CODACY_API_TOKEN: ${{ secrets.CODACY_API_TOKEN }}
          REPO_NAME: ${{ needs.verify.outputs.repo_name }}
        run: |
          set -uo pipefail
          PROJECT_TOKEN=""
          for attempt in $(seq 1 6); do
            if PROJECT_TOKEN=$(bash .github/scripts/codacy-create-token.sh "$REPO_NAME") && [ -n "$PROJECT_TOKEN" ]; then
              break
            fi
            PROJECT_TOKEN=""
            echo "Attempt $attempt failed; retrying in 10s..."
            sleep 10
          done

          if [ -z "$PROJECT_TOKEN" ]; then
            echo "::error title=Codacy Token Error::Failed to generate Codacy token."
            exit 1
          fi

          echo "Token successfully generated!"

          # Mask and set secrets in the new repository
          echo "::add-mask::$PROJECT_TOKEN"

          echo "Setting CODACY_PROJECT_TOKEN secret for Actions..."
          gh secret set CODACY_PROJECT_TOKEN --body "$PROJECT_TOKEN" --repo "$OWNER/$REPO_NAME"

          echo "Setting CODACY_PROJECT_TOKEN secret for Dependabot..."
          gh secret set CODACY_PROJECT_TOKEN --body "$PROJECT_TOKEN" --app dependabot --repo "$OWNER/$REPO_NAME"

  configure-data-settings:
    needs: [verify, create-data-repository]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Allow Actions to Create and Approve PRs on Data Repo
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          DATA_REPO_NAME: ${{ needs.verify.outputs.data_repo_name }}
        run: |
          set -euo pipefail
          echo "Configuring workflow permissions for $DATA_REPO_NAME..."
          gh api --method PUT "repos/$OWNER/$DATA_REPO_NAME/actions/permissions/workflow" \
            -F default_workflow_permissions="write" \
            -F can_approve_pull_request_reviews=true

  configure-data-secrets:
    needs: [verify, create-data-repository]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Set Secrets on Data Repo
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          AOC_APP_CLIENT_ID: ${{ secrets.AOC_APP_CLIENT_ID }}
          AOC_APP_CLIENT_SECRET: ${{ secrets.AOC_APP_CLIENT_SECRET }}
          DATA_REPO_NAME: ${{ needs.verify.outputs.data_repo_name }}
        run: |
          set -euo pipefail
          REPO="$OWNER/$DATA_REPO_NAME"

          echo "Setting PAT_TOKEN secret for Actions on $DATA_REPO_NAME..."
          gh secret set PAT_TOKEN --body "$PAT_TOKEN" --repo "$REPO"

          # The data repository runs the same 'Update year' workflow, which signs
          # its commits with the GitHub App.
          echo "Setting AOC_APP_CLIENT_ID secret..."
          gh secret set AOC_APP_CLIENT_ID --body "$AOC_APP_CLIENT_ID" --repo "$REPO"

          echo "Setting AOC_APP_CLIENT_SECRET secret..."
          gh secret set AOC_APP_CLIENT_SECRET --body "$AOC_APP_CLIENT_SECRET" --repo "$REPO"

  trigger-solutions-update-year:
    needs: [verify, configure-settings, configure-secrets, configure-codacy]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Trigger 'Update year' workflow
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          REPO_NAME: ${{ needs.verify.outputs.repo_name }}
          YEAR: ${{ needs.verify.outputs.year }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if gh workflow run "Update year" --repo "$OWNER/$REPO_NAME" -f aoc_year="$YEAR"; then
              echo "::notice title=Workflow dispatched::'Update year' dispatched on $OWNER/$REPO_NAME."
              exit 0
            fi
            echo "Attempt $attempt failed; retrying in 5s..."
            sleep 5
          done
          echo "::error title=Dispatch failed::Could not dispatch 'Update year' on $OWNER/$REPO_NAME."
          exit 1

  trigger-data-update-year:
    needs: [verify, create-data-repository, configure-data-settings, configure-data-secrets]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Trigger 'Update year' workflow on Data Repository
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          DATA_REPO_NAME: ${{ needs.verify.outputs.data_repo_name }}
          YEAR: ${{ needs.verify.outputs.year }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if gh workflow run "Update year" --repo "$OWNER/$DATA_REPO_NAME" -f aoc_year="$YEAR"; then
              echo "::notice title=Workflow dispatched::'Update year' dispatched on $OWNER/$DATA_REPO_NAME."
              exit 0
            fi
            echo "Attempt $attempt failed; retrying in 5s..."
            sleep 5
          done
          echo "::error title=Dispatch failed::Could not dispatch 'Update year' on $OWNER/$DATA_REPO_NAME."
          exit 1

  # Chained after 'Update year' so both pull requests do not race against each
  # other, and after Codacy so the required checks exist when the PR opens.
  trigger-solutions-add-data-submodule:
    needs: [verify, configure-settings, configure-secrets, configure-codacy, create-data-repository, trigger-solutions-update-year]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Trigger 'Add Data Submodule' workflow
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          REPO_NAME: ${{ needs.verify.outputs.repo_name }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if gh workflow run "Add Data Submodule" --repo "$OWNER/$REPO_NAME"; then
              echo "::notice title=Workflow dispatched::'Add Data Submodule' dispatched on $OWNER/$REPO_NAME."
              exit 0
            fi
            echo "Attempt $attempt failed; retrying in 5s..."
            sleep 5
          done
          echo "::error title=Dispatch failed::Could not dispatch 'Add Data Submodule' on $OWNER/$REPO_NAME."
          exit 1

  generate-pull-request-summary:
    needs: [verify, trigger-solutions-update-year, trigger-data-update-year, trigger-solutions-add-data-submodule]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Find and Annotate Pull Requests
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          REPO_NAME: ${{ needs.verify.outputs.repo_name }}
          DATA_REPO_NAME: ${{ needs.verify.outputs.data_repo_name }}
        run: |
          set -uo pipefail

          {
            echo "### 🎄 Advent of Code Setup Summary"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -z "${REPO_NAME:-}" ]; then
            echo "::warning title=Setup incomplete::Repositories were not created, nothing to summarize."
            echo "- ⚠️ Repository creation did not complete." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          find_pr() {
            local repo="$1"
            local head="$2"
            local url=""
            for attempt in $(seq 1 12); do
              url=$(gh pr list --repo "$repo" --state open --head "$head" --json url --jq '.[0].url // empty' 2>/dev/null || true)
              if [ -n "$url" ]; then
                printf '%s' "$url"
                return 0
              fi
              sleep 10
            done
            return 1
          }

          echo "Looking for the solutions repository PR..."
          SOLUTIONS_PR_URL=$(find_pr "$OWNER/$REPO_NAME" "update-year" || true)

          echo "Looking for the data repository PR..."
          DATA_PR_URL=$(find_pr "$OWNER/$DATA_REPO_NAME" "update-year" || true)

          echo "Looking for the solutions submodule PR..."
          SUBMODULE_PR_URL=$(find_pr "$OWNER/$REPO_NAME" "add-data-submodule" || true)

          if [ -n "$SOLUTIONS_PR_URL" ]; then
            echo "::notice title=Solutions PR Ready::Please review and merge the Update year PR for solutions: $SOLUTIONS_PR_URL"
            echo "- 🚀 **Solutions Repository PR**: [Merge Update PR]($SOLUTIONS_PR_URL)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=Solutions PR missing::Solutions PR could not be found automatically."
            echo "- ⚠️ Solutions Repository PR not found." >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -n "$DATA_PR_URL" ]; then
            echo "::notice title=Data PR Ready::Please review and merge the Update year PR for data: $DATA_PR_URL"
            echo "- 💾 **Data Repository PR**: [Merge Update PR]($DATA_PR_URL)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=Data PR missing::Data PR could not be found automatically."
            echo "- ⚠️ Data Repository PR not found." >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -n "$SUBMODULE_PR_URL" ]; then
            echo "::notice title=Submodule PR Ready::Please review and merge the Submodule PR for solutions: $SUBMODULE_PR_URL"
            echo "- 🔗 **Solutions - Submodule PR**: [Merge PR]($SUBMODULE_PR_URL)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=Submodule PR missing::Solutions Submodule PR could not be found automatically."
            echo "- ⚠️ Solutions Submodule PR not found." >> "$GITHUB_STEP_SUMMARY"
          fi
